name: ERPNext v15 Integration

on:
  pull_request:
    branches: [main]
    # Docs-only or app-only changes do not need a 20 minute bench run.
    paths:
      - 'asoud_erp/**'
      - 'pyproject.toml'
      - '.github/integration-modules.txt'
      - '.github/workflows/erpnext-v15-integration.yml'
  workflow_dispatch:
    inputs:
      fail_fast:
        description: 'Stop a shard at its first failed module (default: run all and list every failure)'
        type: boolean
        default: false

# A newer push supersedes the run in progress for the same PR/branch.
concurrency:
  group: erpnext-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-shard:
    name: integration-shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Cache Frappe download caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            ~/.npm
          key: frappe-v15-downloads-${{ runner.os }}-${{ hashFiles('.github/workflows/erpnext-v15-integration.yml') }}
          restore-keys: |
            frappe-v15-downloads-${{ runner.os }}-

      - name: Install Bench prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client libmariadb-dev gettext
          python -m pip install --upgrade pip frappe-bench
          npm install --global yarn

      - name: Initialize Frappe v15 bench
        run: |
          bench init --skip-assets --skip-redis-config-generation --python python3 --frappe-branch version-15 frappe-bench
          cd frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379
          bench get-app --branch version-15 erpnext https://github.com/frappe/erpnext
          bench get-app --branch version-15 hrms https://github.com/frappe/hrms
          bench get-app "$GITHUB_WORKSPACE"

      - name: Create ERPNext v15 test site
        working-directory: frappe-bench
        run: |
          bench new-site test.localhost --db-root-password root --admin-password admin --no-mariadb-socket
          bench --site test.localhost install-app erpnext
          bench --site test.localhost install-app hrms
          bench --site test.localhost install-app asoud_erp
          bench --site test.localhost migrate
          bench --site test.localhost set-config allow_tests true

      - name: Complete the ERPNext setup wizard for tests
        # ERPNext's before_tests runs the setup wizard only while no Company exists; the
        # company setup tests create one, so run it first to get item groups, UOMs and
        # the test company that the API integration tests use.
        working-directory: frappe-bench
        run: bench --site test.localhost execute erpnext.setup.utils.before_tests

      - name: Run ASOUD setup integration tests
        if: matrix.shard == 0
        working-directory: frappe-bench
        run: >-
          bench --site test.localhost run-tests --app asoud_erp
          --module asoud_erp.asoud_erp.doctype.asoud_company_setup.test_asoud_company_setup

      - name: Run native HR integration tests
        if: matrix.shard == 0
        working-directory: frappe-bench
        run: >-
          bench --site test.localhost run-tests --app asoud_erp --skip-test-records
          --module asoud_erp.asoud_erp.doctype.asoud_personnel_record.test_asoud_personnel_record

      - name: Run workflow request and access integration tests
        if: matrix.shard == 0
        working-directory: frappe-bench
        run: >-
          bench --site test.localhost run-tests --app asoud_erp --skip-test-records
          --module asoud_erp.asoud_erp.doctype.asoud_workflow_request.test_asoud_workflow_request

      - name: Run API module integration tests (shard ${{ matrix.shard }})
        working-directory: frappe-bench
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
          FAIL_FAST: ${{ github.event.inputs.fail_fast }}
        run: |
          failed_modules=()
          index=0
          while read -r module; do
            [ -z "$module" ] && continue
            if [ $((index % SHARDS)) -ne "$SHARD" ]; then
              index=$((index + 1))
              continue
            fi
            index=$((index + 1))
            echo "::group::$module"
            if bench --site test.localhost run-tests --app asoud_erp --skip-test-records \
                --module asoud_erp.integration_tests.$module; then
              echo "PASS: $module"
            else
              failed_modules+=("$module")
              echo "::error::Integration module failed: $module"
              if [ "$FAIL_FAST" = "true" ]; then
                echo "::endgroup::"
                break
              fi
            fi
            echo "::endgroup::"
          done < "$GITHUB_WORKSPACE/.github/integration-modules.txt"
          if ((${#failed_modules[@]})); then
            printf 'Failed integration module: %s\n' "${failed_modules[@]}"
            exit 1
          fi

  # Keeps the original check name for branch protection while the work runs in shards.
  setup-flow:
    needs: integration-shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All shards passed
        run: |
          result='${{ needs.integration-shard.result }}'
          echo "shards: $result"
          [ "$result" = "success" ]
