[project]
name = "asoud_erp"
version = "0.5.0"
description = "Iranian accounting extensions for ERPNext"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["asoud_erp/tests"]
python_files = ["test_*.py"]
